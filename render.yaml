
databases:
  - name: pgdesk-db
    plan: free
    databaseName: pgdesk
    user: pgdesk

services:
  - type: web
    name: pgdesk
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn pgdesk.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: pgdesk-db
          property: connectionString

      - key: GEMINI_API_KEY
        sync: false

      - key: PYTHON_VERSION
        value: "3.11.4"
