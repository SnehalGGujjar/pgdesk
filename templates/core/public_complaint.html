{% extends "core/base.html" %}
{% block title %}Submit a Complaint — {{ prop.name }}{% endblock %}

{% block extra_head %}
<meta name="robots" content="noindex">
{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-indigo-50 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-lg">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-100 mb-3">
                <svg class="w-7 h-7 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Report an Issue</h1>
            <p class="text-gray-500 text-sm mt-1">{{ prop.name }} · {{ prop.city }}</p>
        </div>
        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Room Number <span class="text-red-400">*</span></label>
                    <input type="text" name="room_number" required placeholder="e.g. 402"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Name <span class="text-gray-400">(optional)</span></label>
                    <input type="text" name="tenant_name" placeholder="e.g. Rahul"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">What's the issue? <span class="text-red-400">*</span></label>
                    <textarea name="text" required rows="4" placeholder="Describe the problem..."
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none"></textarea>
                </div>
                <button type="submit"
                    class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm text-base">
                    Submit Complaint
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-gray-400 mt-4">Powered by PGDesk</p>
    </div>
</div>
{% endblock %}
